name: pnu-notice

services:
  web:
    build: .
    env_file: .env
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "--threads", "4", "--timeout", "60", "--access-logfile", "-", "pnu_notice.web:create_app()"]
    expose:
      - "8000"
    volumes:
      - pnu_data:/app/var
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    command: ["pnu-notice", "run-scheduler"]
    volumes:
      - pnu_data:/app/var
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  backup:
    build: .
    env_file: .env
    command: ["sh", "-c", "while true; do pnu-notice backup --directory /app/backups --retention-days 14; sleep 86400; done"]
    volumes:
      - pnu_data:/app/var
      - ./backups:/app/backups
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pnu_data:
  caddy_data:
  caddy_config:
